<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">

  <!-- Background -->
  <rect width="1100" height="780" fill="#0f1117"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold" letter-spacing="2">LINE-FOLLOWING ROBOT — CIRCUIT DIAGRAM</text>
  <text x="550" y="56" text-anchor="middle" fill="#64748b" font-size="11">Created by Sai Praveen Behara</text>
  <line x1="60" y1="66" x2="1040" y2="66" stroke="#1e293b" stroke-width="1"/>

  <!-- ====================================================== -->
  <!-- ARDUINO UNO block -->
  <!-- ====================================================== -->
  <rect x="380" y="260" width="180" height="310" rx="6" fill="#1a2744" stroke="#3b82f6" stroke-width="2"/>
  <text x="470" y="283" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">ARDUINO UNO</text>
  <line x1="390" y1="288" x2="550" y2="288" stroke="#3b82f6" stroke-width="0.7"/>

  <!-- Pin labels on Arduino - left side (sensors D2-D6) -->
  <text x="396" y="310" fill="#94a3b8" font-size="9.5">D2</text>
  <text x="396" y="330" fill="#94a3b8" font-size="9.5">D3</text>
  <text x="396" y="350" fill="#94a3b8" font-size="9.5">D4</text>
  <text x="396" y="370" fill="#94a3b8" font-size="9.5">D5</text>
  <text x="396" y="390" fill="#94a3b8" font-size="9.5">D6</text>
  <text x="396" y="415" fill="#64748b" font-size="8">GND</text>
  <text x="396" y="433" fill="#f87171" font-size="8">5V</text>

  <!-- Pin dots left -->
  <circle cx="382" cy="306" r="3" fill="#3b82f6"/>
  <circle cx="382" cy="326" r="3" fill="#3b82f6"/>
  <circle cx="382" cy="346" r="3" fill="#3b82f6"/>
  <circle cx="382" cy="366" r="3" fill="#3b82f6"/>
  <circle cx="382" cy="386" r="3" fill="#3b82f6"/>
  <circle cx="382" cy="411" r="3" fill="#64748b"/>
  <circle cx="382" cy="429" r="3" fill="#f87171"/>

  <!-- Pin labels on Arduino - right side (motors D7-D13) -->
  <text x="516" y="310" fill="#94a3b8" font-size="9.5">D7</text>
  <text x="516" y="330" fill="#94a3b8" font-size="9.5">D8</text>
  <text x="516" y="350" fill="#94a3b8" font-size="9.5">D9~</text>
  <text x="516" y="370" fill="#94a3b8" font-size="9.5">D10~</text>
  <text x="516" y="390" fill="#94a3b8" font-size="9.5">D11</text>
  <text x="516" y="410" fill="#94a3b8" font-size="9.5">D12</text>
  <text x="516" y="430" fill="#94a3b8" font-size="9.5">D13</text>
  <text x="516" y="453" fill="#64748b" font-size="8">GND</text>
  <text x="516" y="471" fill="#f87171" font-size="8">5V</text>
  <text x="516" y="530" fill="#94a3b8" font-size="8">VIN</text>
  <text x="516" y="550" fill="#64748b" font-size="8">GND</text>

  <!-- Pin dots right -->
  <circle cx="558" cy="306" r="3" fill="#3b82f6"/>
  <circle cx="558" cy="326" r="3" fill="#3b82f6"/>
  <circle cx="558" cy="346" r="3" fill="#f59e0b"/>
  <circle cx="558" cy="366" r="3" fill="#f59e0b"/>
  <circle cx="558" cy="386" r="3" fill="#3b82f6"/>
  <circle cx="558" cy="406" r="3" fill="#3b82f6"/>
  <circle cx="558" cy="426" r="3" fill="#3b82f6"/>
  <circle cx="558" cy="449" r="3" fill="#64748b"/>
  <circle cx="558" cy="467" r="3" fill="#f87171"/>
  <circle cx="558" cy="526" r="3" fill="#fbbf24"/>
  <circle cx="558" cy="546" r="3" fill="#64748b"/>

  <!-- ====================================================== -->
  <!-- IR SENSOR ARRAY block -->
  <!-- ====================================================== -->
  <rect x="80" y="270" width="190" height="230" rx="6" fill="#14261a" stroke="#22c55e" stroke-width="2"/>
  <text x="175" y="292" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">IR SENSOR ARRAY</text>
  <text x="175" y="308" text-anchor="middle" fill="#4ade80" font-size="9">(5x TCRT5000 / QTRX-5A)</text>
  <line x1="90" y1="314" x2="260" y2="314" stroke="#22c55e" stroke-width="0.7"/>

  <!-- 5 sensor sub-blocks -->
  <rect x="92" y="320" width="168" height="28" rx="3" fill="#0d1f11" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="338" fill="#86efac" font-size="9">S0</text>
  <text x="148" y="338" fill="#64748b" font-size="9">Leftmost</text>
  <circle cx="255" cy="334" r="4" fill="#22c55e"/>

  <rect x="92" y="353" width="168" height="28" rx="3" fill="#0d1f11" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="371" fill="#86efac" font-size="9">S1</text>
  <text x="148" y="371" fill="#64748b" font-size="9">Left</text>
  <circle cx="255" cy="367" r="4" fill="#22c55e"/>

  <rect x="92" y="386" width="168" height="28" rx="3" fill="#0d1f11" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="404" fill="#86efac" font-size="9">S2</text>
  <text x="148" y="404" fill="#64748b" font-size="9">Centre</text>
  <circle cx="255" cy="400" r="4" fill="#22c55e"/>

  <rect x="92" y="419" width="168" height="28" rx="3" fill="#0d1f11" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="437" fill="#86efac" font-size="9">S3</text>
  <text x="148" y="437" fill="#64748b" font-size="9">Right</text>
  <circle cx="255" cy="433" r="4" fill="#22c55e"/>

  <rect x="92" y="452" width="168" height="28" rx="3" fill="#0d1f11" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="470" fill="#86efac" font-size="9">S4</text>
  <text x="148" y="470" fill="#64748b" font-size="9">Rightmost</text>
  <circle cx="255" cy="466" r="4" fill="#22c55e"/>

  <!-- Power rail labels for sensor array -->
  <text x="96" y="497" fill="#f87171" font-size="8">VCC (5V)</text>
  <text x="96" y="512" fill="#64748b" font-size="8">GND</text>

  <!-- ====================================================== -->
  <!-- Wires: IR sensors OUT pins -> Arduino D2-D6 -->
  <!-- ====================================================== -->
  <!-- S0 OUT -> D2 -->
  <polyline points="255,334 310,334 310,306 382,306" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- S1 OUT -> D3 -->
  <polyline points="255,367 318,367 318,326 382,326" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- S2 OUT -> D4 -->
  <polyline points="255,400 326,400 326,346 382,346" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- S3 OUT -> D5 -->
  <polyline points="255,433 334,433 334,366 382,366" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- S4 OUT -> D6 -->
  <polyline points="255,466 342,466 342,386 382,386" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Sensor 5V from Arduino -->
  <polyline points="382,429 350,429 350,490 260,490 260,495 95,495" fill="none" stroke="#f87171" stroke-width="1.2"/>
  <!-- Sensor GND from Arduino -->
  <polyline points="382,411 356,411 356,500 260,500 260,510 95,510" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <!-- ====================================================== -->
  <!-- L298N MOTOR DRIVER block -->
  <!-- ====================================================== -->
  <rect x="680" y="260" width="210" height="290" rx="6" fill="#221a14" stroke="#f59e0b" stroke-width="2"/>
  <text x="785" y="283" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">L298N DRIVER</text>
  <line x1="690" y1="288" x2="880" y2="288" stroke="#f59e0b" stroke-width="0.7"/>

  <!-- Input pin labels L side -->
  <circle cx="681" cy="310" r="3" fill="#f59e0b"/>
  <circle cx="681" cy="330" r="3" fill="#f59e0b"/>
  <circle cx="681" cy="352" r="3" fill="#f87171"/>
  <circle cx="681" cy="372" r="3" fill="#f59e0b"/>
  <circle cx="681" cy="392" r="3" fill="#f59e0b"/>
  <circle cx="681" cy="412" r="3" fill="#f87171"/>
  <circle cx="681" cy="432" r="3" fill="#64748b"/>

  <text x="688" y="314" fill="#fde68a" font-size="9.5">IN1</text>
  <text x="688" y="334" fill="#fde68a" font-size="9.5">IN2</text>
  <text x="688" y="356" fill="#fca5a5" font-size="9.5">ENA (PWM)</text>
  <text x="688" y="376" fill="#fde68a" font-size="9.5">IN3</text>
  <text x="688" y="396" fill="#fde68a" font-size="9.5">IN4</text>
  <text x="688" y="416" fill="#fca5a5" font-size="9.5">ENB (PWM)</text>
  <text x="688" y="436" fill="#94a3b8" font-size="9.5">GND</text>

  <!-- Output pin labels R side -->
  <circle cx="889" cy="340" r="3" fill="#ec4899"/>
  <circle cx="889" cy="360" r="3" fill="#ec4899"/>
  <circle cx="889" cy="400" r="3" fill="#a78bfa"/>
  <circle cx="889" cy="420" r="3" fill="#a78bfa"/>

  <text x="840" y="344" fill="#f9a8d4" font-size="9.5">M-LEFT A</text>
  <text x="840" y="364" fill="#f9a8d4" font-size="9.5">M-LEFT B</text>
  <text x="840" y="404" fill="#c4b5fd" font-size="9.5">M-RIGHT A</text>
  <text x="840" y="424" fill="#c4b5fd" font-size="9.5">M-RIGHT B</text>

  <!-- Power inputs on L298N -->
  <text x="720" y="470" fill="#fde68a" font-size="9">VCC (battery +)</text>
  <text x="720" y="487" fill="#94a3b8" font-size="9">GND</text>
  <text x="720" y="504" fill="#f87171" font-size="9">5V OUT -> Arduino 5V</text>
  <circle cx="712" cy="466" r="3" fill="#fbbf24"/>
  <circle cx="712" cy="483" r="3" fill="#64748b"/>
  <circle cx="712" cy="500" r="3" fill="#f87171"/>

  <!-- ====================================================== -->
  <!-- Wires: Arduino -> L298N input pins -->
  <!-- ====================================================== -->
  <!-- D7 -> IN1 -->
  <polyline points="558,306 620,306 620,310 681,310" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- D8 -> IN2 -->
  <polyline points="558,326 625,326 625,330 681,330" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- D9~ -> ENA -->
  <polyline points="558,346 630,346 630,352 681,352" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5,2"/>
  <!-- D10~ -> ENB -->
  <polyline points="558,366 635,366 635,412 681,412" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5,2"/>
  <!-- D11 -> IN3 -->
  <polyline points="558,386 640,386 640,372 681,372" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- D12 -> IN4 -->
  <polyline points="558,406 645,406 645,392 681,392" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- GND -->
  <polyline points="558,449 660,449 660,432 681,432" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <!-- ====================================================== -->
  <!-- MOTORS -->
  <!-- ====================================================== -->
  <!-- Left Motor -->
  <rect x="910" y="310" width="110" height="70" rx="5" fill="#1e1030" stroke="#ec4899" stroke-width="2"/>
  <text x="965" y="336" text-anchor="middle" fill="#f9a8d4" font-size="11" font-weight="bold">DC MOTOR</text>
  <text x="965" y="353" text-anchor="middle" fill="#f9a8d4" font-size="10">LEFT</text>
  <text x="965" y="370" text-anchor="middle" fill="#64748b" font-size="8">6V gear motor</text>
  <line x1="889" y1="340" x2="910" y2="340" stroke="#ec4899" stroke-width="1.8"/>
  <line x1="889" y1="360" x2="910" y2="360" stroke="#ec4899" stroke-width="1.8"/>

  <!-- Right Motor -->
  <rect x="910" y="395" width="110" height="70" rx="5" fill="#1a1030" stroke="#a78bfa" stroke-width="2"/>
  <text x="965" y="420" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">DC MOTOR</text>
  <text x="965" y="437" text-anchor="middle" fill="#c4b5fd" font-size="10">RIGHT</text>
  <text x="965" y="454" text-anchor="middle" fill="#64748b" font-size="8">6V gear motor</text>
  <line x1="889" y1="400" x2="910" y2="420" stroke="#a78bfa" stroke-width="1.8"/>
  <line x1="889" y1="420" x2="910" y2="440" stroke="#a78bfa" stroke-width="1.8"/>

  <!-- ====================================================== -->
  <!-- BATTERY block -->
  <!-- ====================================================== -->
  <rect x="680" y="590" width="210" height="80" rx="6" fill="#1c1408" stroke="#fbbf24" stroke-width="2"/>
  <text x="785" y="612" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">BATTERY</text>
  <text x="785" y="630" text-anchor="middle" fill="#fde68a" font-size="10">7.4V LiPo (2S)</text>
  <text x="785" y="647" text-anchor="middle" fill="#64748b" font-size="9">or 2x 18650 in series</text>
  <circle cx="712" cy="660" r="3" fill="#fbbf24"/>
  <circle cx="858" cy="660" r="3" fill="#64748b"/>
  <text x="720" y="664" fill="#fde68a" font-size="8">BATT +</text>
  <text x="820" y="664" fill="#94a3b8" font-size="8">BATT -</text>

  <!-- Battery + to L298N VCC -->
  <polyline points="712,660 712,566 712,500" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <!-- Battery - to L298N GND -->
  <polyline points="858,660 858,560 760,560 760,483 712,483" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- L298N 5V out -> Arduino 5V -->
  <polyline points="712,500 650,500 650,467 558,467" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <!-- Battery GND -> Arduino GND -->
  <polyline points="660,432 660,546 558,546" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <!-- Arduino VIN from battery -->
  <polyline points="712,466 700,466 700,526 558,526" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- ====================================================== -->
  <!-- START BUTTON block -->
  <!-- ====================================================== -->
  <rect x="380" y="620" width="110" height="60" rx="5" fill="#141c2a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="435" y="644" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">START</text>
  <text x="435" y="660" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">BUTTON</text>
  <text x="435" y="674" text-anchor="middle" fill="#64748b" font-size="8">Tactile, active LOW</text>
  <!-- Button to D13 -->
  <polyline points="435,620 435,600 475,600 475,560 530,560 530,426 558,426" fill="none" stroke="#60a5fa" stroke-width="1.3" stroke-dasharray="4,2"/>
  <!-- Button to GND -->
  <polyline points="490,680 490,700 570,700 570,546 558,546" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="492" y="693" fill="#64748b" font-size="8">GND</text>

  <!-- ====================================================== -->
  <!-- DECOUPLING CAPACITOR note -->
  <!-- ====================================================== -->
  <rect x="80" y="570" width="200" height="55" rx="5" fill="#0f1117" stroke="#475569" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="90" y="589" fill="#94a3b8" font-size="9" font-weight="bold">DECOUPLING CAP (recommended)</text>
  <text x="90" y="603" fill="#64748b" font-size="8">10 uF electrolytic capacitor</text>
  <text x="90" y="616" fill="#64748b" font-size="8">across motor power rail (+ / GND)</text>
  <text x="90" y="628" fill="#64748b" font-size="8">reduces voltage spikes / noise</text>

  <!-- ====================================================== -->
  <!-- LEGEND -->
  <!-- ====================================================== -->
  <rect x="80" y="690" width="610" height="68" rx="5" fill="#0c1119" stroke="#1e293b" stroke-width="1"/>
  <text x="96" y="708" fill="#94a3b8" font-size="10" font-weight="bold">LEGEND</text>

  <line x1="150" y1="722" x2="186" y2="722" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="192" y="726" fill="#86efac" font-size="9">Sensor data signal</text>

  <line x1="290" y1="722" x2="326" y2="722" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="332" y="726" fill="#fde68a" font-size="9">Motor direction pin</text>

  <line x1="435" y1="722" x2="471" y2="722" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,2"/>
  <text x="477" y="726" fill="#fca5a5" font-size="9">PWM speed pin</text>

  <line x1="560" y1="722" x2="596" y2="722" stroke="#fbbf24" stroke-width="2"/>
  <text x="602" y="726" fill="#fde68a" font-size="9">Battery / power rail</text>

  <line x1="150" y1="744" x2="186" y2="744" stroke="#64748b" stroke-width="1.5"/>
  <text x="192" y="748" fill="#94a3b8" font-size="9">Ground (GND)</text>

  <line x1="290" y1="744" x2="326" y2="744" stroke="#f87171" stroke-width="1.5"/>
  <text x="332" y="748" fill="#fca5a5" font-size="9">5V regulated supply</text>

  <line x1="435" y1="744" x2="471" y2="744" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="477" y="748" fill="#93c5fd" font-size="9">Optional (start button)</text>

  <!-- ====================================================== -->
  <!-- D2-D6 wire labels -->
  <!-- ====================================================== -->
  <text x="313" y="300" fill="#22c55e" font-size="8">S0..S4</text>
  <text x="313" y="312" fill="#22c55e" font-size="7">D2-D6</text>

  <!-- Motor driver wire labels -->
  <text x="590" y="298" fill="#f59e0b" font-size="8">D7-D8</text>
  <text x="590" y="310" fill="#f59e0b" font-size="7">IN1-IN2</text>
  <text x="590" y="340" fill="#f87171" font-size="8">D9~/ENA</text>
  <text x="590" y="375" fill="#f87171" font-size="8">D10~/ENB</text>
  <text x="590" y="400" fill="#f59e0b" font-size="8">D11-D12</text>
  <text x="590" y="412" fill="#f59e0b" font-size="7">IN3-IN4</text>

</svg>
